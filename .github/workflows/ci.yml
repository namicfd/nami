# Blocking gate for pull requests and the merge queue (ADR-0009). Target: about 5 minutes.
# `just check-full` runs exactly what developers and agents run locally.
name: ci

on:
  # `ready_for_review` too: the CI-hosted review (`review.yml`, #59) starts after `ci`, and a
  # draft is not reviewed, so a draft marked ready would otherwise wait for its next push.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Reading pull requests lets check-pr tell the nami-ci bot's PR from any other: in the merge
    # queue, and for a PR that sets `passes`. A PR's own head comes from the event.
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Two commits deep: in the merge queue, the PR's own commit is compared with its parent.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: ./.github/actions/setup
      - name: just check-full
        run: just check-full
      # Only the nami-ci bot's PR from `bot/passes` may set `passes` in a plan's tasks.json, and
      # only when the flipped tasks' acceptance tests pass in this run (ADR-0011, ADR-0017). On
      # `task/<id>` branches this also lists files outside the task's owner_paths (advisory).
      - name: Only the bot's PR sets passes
        if: github.event_name != 'push'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_REF: ${{ github.head_ref || github.event.merge_group.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --quiet --no-tags --depth=1 origin "$BASE_SHA"
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            cargo xtask task check-pr "$BASE_SHA" "$HEAD_REF" "$PR_NUMBER" \
              --author "$PR_AUTHOR" --head-repo "$PR_HEAD_REPO" --repo "$REPOSITORY"
          else
            cargo xtask task check-pr "$BASE_SHA" "${HEAD_REF#refs/heads/}" ""
          fi

  # The dylint library's own UI tests: each lint fires where it must and stays silent elsewhere.
  lints:
    name: lints (UI tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: cargo test (lints/)
        working-directory: lints
        run: cargo test --locked

  # Mutation testing of the PR's changed lines. Advisory until it reliably fits the time budget;
  # then it becomes a required check with zero surviving mutants (ADR-0009).
  mutants-diff:
    name: mutants (diff, advisory)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Diff against the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git diff "origin/${BASE_REF}...HEAD" > pr.diff
      - name: cargo mutants --in-diff
        run: cargo mutants --in-diff pr.diff --test-tool nextest --timeout 120 --no-shuffle
