# The CI-hosted AI review, and the reviewer app's approval of a pull request's head (#59;
# ADR-0008, ADR-0022, ADR-0023). It runs after `ci` passes on a pull request from this
# repository. The logic is in `cargo xtask review` (xtask/src/review.rs); these jobs only call
# it. None of them is a required check: what they produce is a review by `nami-reviewer[bot]`.
#
# - `review (select)` decides what the head gets: the model's review for a PR by
#   nami-agent[bot] or a code owner, a mechanical approval for the nami-ci bot's `bot/passes`
#   PR, whose review is `check-pr` in `ci`'s `gate` (ADR-0017), and nothing for anyone else.
# - `review (model)` runs Claude Code on the PR with read-only tools and writes its answer as
#   data. It holds no stored key: it signs in to Anthropic through workload identity
#   federation, with GitHub's OIDC token for this job, and never holds an app's key.
# - `review (post)` holds the reviewer app's key, runs no PR code, reads the answer as data,
#   and posts one review on the head: APPROVE when nothing blocks, otherwise COMMENT with each
#   blocking finding as a thread. A push dismisses the approval (the ruleset's "dismiss stale
#   approvals"), and the new head's `ci` starts this workflow again. Because the reviewer is
#   never the last pusher, its approval satisfies the ruleset's "approve the last push".
#
# The jobs follow ADR-0023's rules for a job that holds a key:
# - `workflow_run` runs main's version of this file and of xtask, never a PR's; the `if:` checks
#   the event and the triggering workflow's path; the checkouts have no `ref:` (rule 4);
# - the reviewer app's key is the secret NAMI_REVIEWER_PRIVATE_KEY of the environment
#   `nami-reviewer`, which only main may use (rule 1; docs/operations/github-setup.md, step
#   11). That environment must exist before this file reaches main: a job that names a missing
#   environment makes GitHub create it with no branch rule. The model job's Anthropic access
#   has no secret and needs no environment: Anthropic's federation rule accepts only an OIDC
#   token for this repository's `refs/heads/main`, from a `workflow_run`, whose
#   `job_workflow_ref` is this file on main, which a PR, another branch or another workflow
#   cannot mint (docs/operations/github-setup.md, step 11, has the rule's exact match);
# - one step has the secret in its environment (rule 3); `id-token: write` is in the model
#   job only;
# - two tokens, each narrow (rule 2): every read uses the workflow's own token, GH_TOKEN; the
#   reviewer app's token, NAMI_REVIEW_TOKEN, is narrowed to `pull_requests: write` and only
#   resolves threads and posts the review;
# - no cache is restored (rule 5): each job builds xtask from a clean checkout, and Claude Code
#   is installed at the pinned version below.
#
# The model job reads the PR's files, but executes none of them. Claude Code runs with
# `--restricted` (no tool that runs commands or code, no settings file of the user or the
# project, so no hooks from them, file tools confined to the context and tree directories),
# `--settings '{"disableAllHooks":true}'`, `--strict-mcp-config` (no MCP server),
# `--disable-slash-commands` (no skills), CLAUDE_CODE_DISABLE_CLAUDE_MDS and
# CLAUDE_CODE_DISABLE_AUTO_MEMORY, with only Read, Grep, Glob and Agent. Not `--bare`, which
# would do the same but signs in only with an API key, and ignores federation. Its working
# directory is the context directory, not the tree, and the tree is an export of the head
# commit, not a checkout. The identity token's file is outside both directories, and the job
# fails rather than upload an answer that contains the token or GitHub's request token.
name: review

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions: {}

# Named, so that GitHub runs `bash --noprofile --norc -eo pipefail`: without `shell:`, it runs
# `bash -e` without pipefail, and a failed `cargo xtask review select | tee` or `git archive |
# tar` would pass (#98's review).
defaults:
  run:
    shell: bash

# A newer run for the same branch replaces an older one: an older head is never approved
# after a newer one, and a review of a head that moved on costs nothing more.
concurrency:
  group: >-
    review-${{ github.event.workflow_run.head_repository.full_name }}-${{
    github.event.workflow_run.head_branch }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The pinned Claude Code release, the model and the budget of one review run. The decision
  # on #59 caps a run at 2 USD; Claude Code checks the cap after each turn, so the cap here
  # leaves one turn's margin. A run over it is no verdict, and the PR falls back to a code
  # owner.
  CLAUDE_CODE_VERSION: 2.1.332
  REVIEW_MODEL: claude-opus-5-5
  REVIEW_EFFORT: high
  REVIEW_BUDGET_USD: "1.60"

jobs:
  select:
    name: review (select)
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.path == '.github/workflows/ci.yml' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      kind: ${{ steps.select.outputs.kind }}
      pr: ${{ steps.select.outputs.pr }}
      head: ${{ steps.select.outputs.head }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Build xtask
        run: cargo build --quiet --locked --package xtask
      - name: cargo xtask review select
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          {
            echo "pr=${PR_NUMBER}"
            echo "head=${HEAD_SHA}"
          } >> "${GITHUB_OUTPUT}"
          if [[ -z "${PR_NUMBER}" ]]; then
            echo "kind=none" >> "${GITHUB_OUTPUT}"
            echo "No pull request of this repository has head ${HEAD_SHA}; nothing to review."
            exit 0
          fi
          cargo xtask review select --pr "${PR_NUMBER}" --head "${HEAD_SHA}" |
            tee -a "${GITHUB_OUTPUT}"

  review:
    name: review (model)
    needs: select
    if: needs.select.outputs.kind == 'ai'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # No environment: with none, GitHub's OIDC subject ends in `:ref:<ref>`, which for a
    # `workflow_run` job is `refs/heads/main`. The repository uses GitHub's immutable subject,
    # so it starts `repo:namicfd@360887709/nami@1470964610`. Anthropic's federation rule
    # matches that subject, and this file's `job_workflow_ref` on main. `id-token: write` lets
    # this job, and only it, ask GitHub for that token.
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    env:
      PR_NUMBER: ${{ needs.select.outputs.pr }}
      HEAD_SHA: ${{ needs.select.outputs.head }}
    steps:
      # Main's full history: the merge base of a head on an older main is found only in it.
      # A depth-1 checkout leaves main's tip without parents, and `git merge-base` then fails
      # for every PR that main has moved past (#98's review).
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Build xtask
        run: cargo build --quiet --locked --package xtask
      - name: Install Claude Code
        run: |
          npm install --prefix "${RUNNER_TEMP}/claude" --no-save --no-fund --no-audit \
            "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          "${RUNNER_TEMP}/claude/node_modules/.bin/claude" --version
      # The head as files, not as a checkout: no `.git` of the PR's, and nothing in it runs.
      - name: Export the head and its diff
        run: |
          git fetch --quiet --no-tags origin "${HEAD_SHA}"
          mkdir -p "${RUNNER_TEMP}/review/tree" "${RUNNER_TEMP}/review/context"
          git archive "${HEAD_SHA}" | tar -x -C "${RUNNER_TEMP}/review/tree"
          base=$(git merge-base origin/main "${HEAD_SHA}")
          git diff "${base}" "${HEAD_SHA}" > "${RUNNER_TEMP}/review/context/diff.patch"
      - name: cargo xtask review context
        env:
          GH_TOKEN: ${{ github.token }}
          NAMI_REVIEWER_LOGIN: ${{ vars.NAMI_REVIEWER_LOGIN }}
        run: |
          cargo xtask review context --pr "${PR_NUMBER}" --tree "${RUNNER_TEMP}/review/tree" \
            --out "${RUNNER_TEMP}/review/context"
      # Workload identity federation: Claude Code reads GitHub's OIDC token from
      # ANTHROPIC_IDENTITY_TOKEN_FILE, and exchanges it for an Anthropic token as the Console
      # service account. A GitHub token lives about 5 minutes and is good for one exchange, and
      # an exchanged token at most twice the GitHub token's remaining life. So a background
      # loop writes a new token every 2 minutes; Claude Code reads the file again at each
      # exchange. The IDs are identifiers, not credentials, and are written here as Anthropic's
      # own example does: they name the Console's federation rule, its service account and
      # workspace, and the organization (docs/operations/github-setup.md, step 11).
      - name: Review with Claude Code
        working-directory: ${{ runner.temp }}/review/context
        env:
          ANTHROPIC_FEDERATION_RULE_ID: fdrl_017fSGiRGU5Jfp7u97ALXiBR
          ANTHROPIC_ORGANIZATION_ID: 0416496c-32e5-4763-9196-74c97ee546c1
          ANTHROPIC_SERVICE_ACCOUNT_ID: svac_01KnMx9ku6iFenthj25yPLd3
          ANTHROPIC_WORKSPACE_ID: wrkspc_01VYB3z9y8d3zv3c4bMQHJAr
          CLAUDE_CODE_DISABLE_CLAUDE_MDS: "1"
          CLAUDE_CODE_DISABLE_AUTO_MEMORY: "1"
          # What `--bare` also turned off: the pinned release stays pinned, and nothing but
          # the model's API is called.
          DISABLE_AUTOUPDATER: "1"
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        run: |
          # A key in the environment would win over federation without a word.
          unset ANTHROPIC_API_KEY ANTHROPIC_AUTH_TOKEN CLAUDE_CODE_OAUTH_TOKEN
          oidc="${RUNNER_TEMP}/oidc"
          (umask 077 && mkdir -p "${oidc}")
          export ANTHROPIC_IDENTITY_TOKEN_FILE="${oidc}/token"
          # The request token goes through stdin, so it never shows in the process list. Each
          # step returns on failure itself: under `fetch || ...`, bash turns errexit off inside
          # the function, and a failed fetch must leave the last good token in place (#98's
          # review). Every token written is kept in `all`, for the leak check below.
          fetch() {
            printf 'Authorization: Bearer %s\n' "${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" |
              curl --silent --show-error --fail --header @- \
                "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://api.anthropic.com" |
              jq -re '.value | select(type == "string" and length > 0)' > "${oidc}/next" ||
              return 1
            [[ -s "${oidc}/next" ]] || return 1
            cat "${oidc}/next" >> "${oidc}/all" || return 1
            mv -f "${oidc}/next" "${ANTHROPIC_IDENTITY_TOKEN_FILE}" || return 1
          }
          fetch
          # The claims that the federation rule matches, for the log; never the token.
          cut -d. -f2 < "${ANTHROPIC_IDENTITY_TOKEN_FILE}" | tr '_-' '/+' |
            awk '{ while (length($0) % 4) $0 = $0 "="; print }' | base64 -d |
            jq -c '{sub, ref, job_workflow_ref, environment, event_name}' ||
            echo "::warning::the OIDC token's claims could not be shown"
          (
            while sleep 120; do
              fetch || echo "::warning::refreshing the OIDC token failed"
            done
          ) &
          refresher=$!
          trap 'kill "${refresher}" 2> /dev/null || true; rm -rf "${oidc}"' EXIT
          status=0
          # The model's process has no use for GitHub's request token, which mints OIDC tokens
          # for any audience, so it starts without it. This step's own shell still holds it;
          # what keeps the model from that shell's environment is the file tools' directory
          # limits (`--restricted`), not this.
          env -u ACTIONS_ID_TOKEN_REQUEST_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL \
            "${RUNNER_TEMP}/claude/node_modules/.bin/claude" -p --restricted \
            --settings '{"disableAllHooks":true}' --strict-mcp-config --disable-slash-commands \
            --tools Read,Grep,Glob,Agent --permission-prompts none --no-session-persistence \
            --add-dir "${RUNNER_TEMP}/review/tree" --agents agents.json \
            --model "${REVIEW_MODEL}" --effort "${REVIEW_EFFORT}" \
            --max-budget-usd "${REVIEW_BUDGET_USD}" \
            --output-format json --json-schema "$(cat schema.json)" \
            "$(cat prompt.md)" > "${RUNNER_TEMP}/review/result.json" || status=$?
          echo "Claude Code exited with ${status}; the post job reads its result."
          kill "${refresher}" 2> /dev/null || true
          result="${RUNNER_TEMP}/review/result.json"
          leaked=false
          # grep exits 1 for no match; a match (0) or its own error (2) counts as a leak, so
          # that the check never fails open.
          found=0
          grep -qF -- "${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${result}" || found=$?
          if [[ "${found}" != 1 ]]; then leaked=true; fi
          found=0
          grep -qF -f "${oidc}/all" "${result}" || found=$?
          if [[ "${found}" != 1 ]]; then leaked=true; fi
          if [[ "${leaked}" == true ]]; then
            : > "${result}"
            echo "::error::The review's answer contains a token; nothing is uploaded."
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: review-result
          path: ${{ runner.temp }}/review/result.json
          retention-days: 7
          if-no-files-found: error

  post:
    name: review (post)
    needs: [select, review]
    # Also when the model job failed: then the post says that there is no verdict. Never
    # after a cancellation: a newer run handles the newer head.
    if: >-
      !cancelled() &&
      (needs.select.outputs.kind == 'ai' || needs.select.outputs.kind == 'passes')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: nami-reviewer
    permissions:
      contents: read
      pull-requests: read
    env:
      PR_NUMBER: ${{ needs.select.outputs.pr }}
      HEAD_SHA: ${{ needs.select.outputs.head }}
      KIND: ${{ needs.select.outputs.kind }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Build xtask
        run: cargo build --quiet --locked --package xtask
      - uses: actions/download-artifact@v8
        if: env.KIND == 'ai'
        continue-on-error: true
        with:
          name: review-result
          path: ${{ runner.temp }}/result
      # A missing result is read as no verdict, never as a review.
      - name: Check the model's result
        if: env.KIND == 'ai'
        run: |
          result="${RUNNER_TEMP}/result/result.json"
          if [[ ! -s "${result}" ]]; then
            mkdir -p "${RUNNER_TEMP}/result"
            printf '{"subtype": "missing", "is_error": true}\n' > "${result}"
          fi
      # The secret is in this step's environment only. Later steps' processes never have it in
      # theirs: they get the file, which is deleted as soon as the token is minted.
      - name: Write the reviewer app's key
        env:
          NAMI_REVIEWER_PRIVATE_KEY: ${{ secrets.NAMI_REVIEWER_PRIVATE_KEY }}
        run: |
          if [[ -z "${NAMI_REVIEWER_PRIVATE_KEY}" ]]; then
            echo "::error::The nami-reviewer environment has no NAMI_REVIEWER_PRIVATE_KEY" \
              "secret; see docs/operations/github-setup.md, step 11"
            exit 1
          fi
          (umask 077 &&
            printf '%s\n' "${NAMI_REVIEWER_PRIVATE_KEY}" > "${RUNNER_TEMP}/reviewer.pem")
      - name: cargo xtask review post
        env:
          GH_TOKEN: ${{ github.token }}
          NAMI_AGENT_APP: reviewer
          NAMI_REVIEWER_CLIENT_ID: ${{ vars.NAMI_REVIEWER_CLIENT_ID }}
          NAMI_REVIEWER_LOGIN: ${{ vars.NAMI_REVIEWER_LOGIN }}
          NAMI_AGENT_PERMISSIONS: '{"pull_requests":"write"}'
        run: |
          key="${RUNNER_TEMP}/reviewer.pem"
          trap 'rm -f "${key}"' EXIT
          NAMI_REVIEW_TOKEN=$(NAMI_REVIEWER_KEY="${key}" NAMI_AGENT_REPO="${GITHUB_REPOSITORY}" \
            xtask/agent-token.sh)
          # The key file is gone before xtask starts.
          rm -f "${key}"
          echo "::add-mask::${NAMI_REVIEW_TOKEN}"
          export NAMI_REVIEW_TOKEN
          if [[ "${KIND}" == passes ]]; then
            cargo xtask review approve-passes --pr "${PR_NUMBER}" --head "${HEAD_SHA}"
          else
            cargo xtask review post --pr "${PR_NUMBER}" --head "${HEAD_SHA}" \
              --result "${RUNNER_TEMP}/result/result.json"
          fi
      - name: Delete the reviewer app's key
        if: always()
        run: rm -f "${RUNNER_TEMP}/reviewer.pem"
