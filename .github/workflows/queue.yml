# The merge queue's two blind spots (issue #51). Git merges two ADRs with one number without a
# conflict, so the clash shows only when the second PR fails tidy in the queue; and a PR that
# fails in the queue drops out with nobody told. Neither job is a required check. The logic is
# in `cargo xtask queue` (xtask/src/queue.rs); these jobs only call it.
name: queue

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Advisory early warning: one comment on the PR, kept up to date, that names the ADR numbers
  # it adds which `main` or another open PR also uses, and who renumbers (ADR-0000). It posts
  # as the workflow's own token. A fork's PR gets a read-only token, so it is skipped.
  adr-clashes:
    name: adr clashes (advisory)
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: queue-clashes-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # The code owners on main decide whose open PRs count (ADR-0021).
      - name: Fetch main
        run: git fetch --quiet --no-tags --depth=1 origin main:refs/remotes/origin/main
      - name: cargo xtask queue clashes
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: cargo xtask queue clashes --pr "$PR_NUMBER" --comment

  # Ownership of queue failures: when the required checks fail on a merge-queue branch and the
  # PR has really left the queue, file an issue of kind `bug` for it, as nami-agent[bot], so
  # that `cargo xtask task ready` lists it and the next session rebases or renumbers the PR on
  # its own branch (ADR-0021, point 6). One issue per failed run: the title names the run, so a
  # re-run of it finds its open issue and files nothing. No concurrency group: two runs file
  # two different issues, and a group could cancel a pending job and lose a failure.
  #
  # `workflow_run` runs main's version of this file and of xtask, never a PR's, so the bot's
  # key never meets a PR's code. The key lives in the `nami-agent` environment, which only
  # main may use (docs/operations/github-setup.md, step 8). The token is narrowed to what the
  # job needs: read the run, its jobs and logs, the PR and the repository; write issues.
  queue-failure:
    name: file queue failure
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.path == '.github/workflows/ci.yml' &&
      github.event.workflow_run.event == 'merge_group' &&
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: nami-agent
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Fetch main
        run: git fetch --quiet --no-tags --depth=1 origin main:refs/remotes/origin/main
      - name: Build xtask
        run: cargo build --quiet --locked --package xtask
      # The secret is in this step's environment only. Later steps' processes never have it in
      # theirs: they get the file, which is deleted as soon as the token is minted.
      - name: Write the bot's key
        env:
          NAMI_AGENT_PRIVATE_KEY: ${{ secrets.NAMI_AGENT_PRIVATE_KEY }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [[ -z "${NAMI_AGENT_PRIVATE_KEY}" ]]; then
            echo "::error::The nami-agent environment has no NAMI_AGENT_PRIVATE_KEY secret, so" \
              "the failure of run ${RUN_ID} cannot be filed as the bot; see" \
              "docs/operations/github-setup.md, step 8"
            exit 1
          fi
          (umask 077 && printf '%s\n' "${NAMI_AGENT_PRIVATE_KEY}" > "${RUNNER_TEMP}/nami-agent.pem")
      - name: cargo xtask queue failed
        env:
          NAMI_AGENT_PERMISSIONS: >-
            {"issues":"write","actions":"read","contents":"read","pull_requests":"read"}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          key="${RUNNER_TEMP}/nami-agent.pem"
          trap 'rm -f "${key}"' EXIT
          GH_TOKEN=$(NAMI_AGENT_KEY="${key}" NAMI_AGENT_REPO="${GITHUB_REPOSITORY}" \
            xtask/agent-token.sh)
          # The key file is gone before xtask starts.
          rm -f "${key}"
          echo "::add-mask::${GH_TOKEN}"
          export GH_TOKEN
          cargo xtask queue failed --run "${RUN_ID}"
      - name: Delete the bot's key
        if: always()
        run: rm -f "${RUNNER_TEMP}/nami-agent.pem"
