# The merge queue's two blind spots (issue #51). Git merges two ADRs with one number without a
# conflict, so the clash shows only when the second PR fails tidy in the queue; and a PR that
# fails in the queue drops out with nobody told. Neither job is a required check. The logic is
# in `cargo xtask queue` (xtask/src/queue.rs); these jobs only call it.
name: queue

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions: {}

concurrency:
  group: queue-${{ github.event.pull_request.number || github.event.workflow_run.id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Advisory early warning: one comment on the PR, kept up to date, that names the ADR numbers
  # it adds which `main` or another open PR also uses, and who renumbers (ADR-0000). It posts
  # as the workflow's own token. A fork's PR gets a read-only token, so it is skipped.
  adr-clashes:
    name: adr clashes (advisory)
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # The code owners on main decide whose open PRs count (ADR-0021).
      - name: Fetch main
        run: git fetch --quiet --no-tags --depth=1 origin main:refs/remotes/origin/main
      - name: cargo xtask queue clashes
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: cargo xtask queue clashes --pr "$PR_NUMBER" --comment

  # Ownership of queue failures: when the required checks fail on a merge-queue branch, file an
  # issue of kind `bug` for the PR, as nami-agent[bot], so that `cargo xtask task ready` lists
  # it and the next session rebases or renumbers the PR (ADR-0021). A re-run finds the open
  # issue and files nothing.
  #
  # `workflow_run` runs main's version of this file and of xtask, never a PR's, so the bot's
  # key never meets a PR's code. The key lives in the `nami-agent` environment, which only
  # main may use (docs/operations/github-setup.md, step 8). The token is narrowed to what the
  # job needs: read the run, its jobs and logs, and the repository; write issues.
  queue-failure:
    name: file queue failure
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'merge_group' &&
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: nami-agent
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Fetch main
        run: git fetch --quiet --no-tags --depth=1 origin main:refs/remotes/origin/main
      - name: Build xtask
        run: cargo build --quiet --locked --package xtask
      - name: cargo xtask queue failed
        env:
          NAMI_AGENT_PRIVATE_KEY: ${{ secrets.NAMI_AGENT_PRIVATE_KEY }}
          NAMI_AGENT_PERMISSIONS: '{"issues":"write","actions":"read","contents":"read"}'
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [[ -z "${NAMI_AGENT_PRIVATE_KEY}" ]]; then
            echo "::error::The nami-agent environment has no NAMI_AGENT_PRIVATE_KEY secret, so" \
              "the failure of run ${RUN_ID} cannot be filed as the bot; see" \
              "docs/operations/github-setup.md, step 8"
            exit 1
          fi
          key="${RUNNER_TEMP}/nami-agent.pem"
          trap 'rm -f "${key}"' EXIT
          (umask 077 && printf '%s\n' "${NAMI_AGENT_PRIVATE_KEY}" > "${key}")
          GH_TOKEN=$(NAMI_AGENT_KEY="${key}" NAMI_AGENT_REPO="${GITHUB_REPOSITORY}" \
            xtask/agent-token.sh)
          rm -f "${key}"
          echo "::add-mask::${GH_TOKEN}"
          export GH_TOKEN
          cargo xtask queue failed --run "${RUN_ID}"
