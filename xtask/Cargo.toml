[package]
name = "xtask"
description = "Project tooling for nami: tidy and future checks (ADR-0006)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

# Tooling-only dependencies, allowed by ADR-0001. Never used by nami crates.
[dependencies]
proc-macro2 = { version = "=1.0.107", default-features = false, features = ["span-locations"] }
syn = { version = "=3.0.10", default-features = false, features = ["full", "parsing", "printing", "visit"] }
